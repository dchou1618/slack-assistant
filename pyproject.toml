[project]
name = "slack-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ollama==0.6.2",
    "python-dotenv==1.2.3",
    "slack-bolt==1.30.0",
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_assistant"]