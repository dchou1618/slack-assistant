name: CI

on:
  push:
  pull_request:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 566946613677.dkr.ecr.us-east-1.amazonaws.com/slack-assistant

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest test/ --cov=src/slack_assistant --cov-report=term-missing --cov-fail-under=90

  build-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            --tag "${ECR_REPOSITORY}:${GITHUB_SHA}" \
            --tag "${ECR_REPOSITORY}:latest" \
            .
          docker save "${ECR_REPOSITORY}:${GITHUB_SHA}" "${ECR_REPOSITORY}:latest" \
            --output /tmp/slack-assistant-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: slack-assistant-image-${{ github.sha }}
          path: /tmp/slack-assistant-image.tar
          retention-days: 1

  publish-image:
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: slack-assistant-image-${{ github.sha }}
          path: /tmp
      - name: Debug GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
      - name: Load Docker image
        run: docker load --input /tmp/slack-assistant-image.tar
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Push Docker image
        run: |
          docker push "${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "${ECR_REPOSITORY}:latest"